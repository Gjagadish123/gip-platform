# One GitHub Pages site, three static previews:
#   admin    → https://gjagadish123.github.io/gip-platform/          (the link the client already has)
#   website  → https://gjagadish123.github.io/gip-platform/site/
#   layouts  → https://gjagadish123.github.io/gip-platform/layouts/  (live layouts app; ?project=<id> opens one)
# All are noindex previews; the real website launches on a Node host with the image optimizer and Cache Components.
# All run on the live Supabase project: the admin signs in and writes there, the website reads it at build time, and
# the layouts app reads statuses in the browser and follows them live. The URL and publishable key are public by
# design (every visitor's browser gets them; RLS decides what they can read). The Google Maps browser key is a
# repository secret (VITE_GOOGLE_MAPS_API_KEY, or the older NEXT_PUBLIC_GOOGLE_MAPS_API_KEY) and the vector map id a
# repository variable (VITE_GOOGLE_MAP_ID). Never put the Supabase secret key here.
#
# The website is a build-time copy of the live data. To keep it current the database asks for a run when projects or
# plots change (supabase/migrations/20261112120000_site_rebuild.sql: workflow_dispatch with only_if_changed), and the
# schedule is a backup. Both make the check job fingerprint what the website reads (.github/scripts/site-data-version.mjs)
# and compare it with the deployed site/data-version.txt; only a difference builds and deploys.
name: Deploy previews to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["admin/**", "website/**", "layouts/**", ".github/workflows/deploy-admin-pages.yml", ".github/scripts/**"]
  workflow_dispatch:
    inputs:
      only_if_changed:
        description: "Build only if the published data changed (how the database asks)"
        type: boolean
        default: false
  schedule:
    # Off the hour (GitHub delays or drops scheduled runs at busy minutes like :00).
    - cron: "7-59/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://jjskgxbshmjsfrowlzsj.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cJWKoNVL9CRIxkrwRHLxsw_aVvCxAjU
  NEXT_PUBLIC_LAYOUTS_URL: https://gjagadish123.github.io/gip-platform/layouts/

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        name: Has the live data changed?
        run: |
          version=$(node .github/scripts/site-data-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.only_if_changed }}" != "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live=$(curl -fsS "https://gjagadish123.github.io/gip-platform/site/data-version.txt?t=$(date +%s)" || true)
          if [ "$live" = "$version" ]; then echo "build=false" >> "$GITHUB_OUTPUT"; echo "Website is current."; else echo "build=true" >> "$GITHUB_OUTPUT"; echo "Live data changed: rebuilding."; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    # A newer build replaces one in progress; the check above never takes the lock, so it can't cancel a deploy.
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            website/package-lock.json
            layouts/package-lock.json

      - name: Build admin (/gip-platform/)
        working-directory: admin
        run: |
          npm ci
          npx next build
          node scripts/flatten-segments.mjs out
        env:
          GITHUB_PAGES: "true"

      - name: Build website (/gip-platform/site/)
        working-directory: website
        run: |
          npm ci
          npx next build
          node scripts/flatten-segments.mjs out
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /gip-platform/site

      - name: Build live layouts (/gip-platform/layouts/)
        working-directory: layouts
        run: |
          npm ci
          npx vite build
        env:
          VITE_BASE: /gip-platform/layouts/
          VITE_SUPABASE_URL: https://jjskgxbshmjsfrowlzsj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cJWKoNVL9CRIxkrwRHLxsw_aVvCxAjU
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY || secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ vars.VITE_GOOGLE_MAP_ID }}
          VITE_WEBSITE_URL: https://gjagadish123.github.io/gip-platform/site/

      - name: Assemble one Pages tree
        run: |
          mkdir -p admin/out/site admin/out/layouts
          cp -R website/out/. admin/out/site/
          cp -R layouts/dist/. admin/out/layouts/
          touch admin/out/.nojekyll
          # The data this build read (the schedule compares it with the live data).
          echo -n "${{ needs.check.outputs.version }}" > admin/out/site/data-version.txt
          # The website used to host the live layouts at site/layouts/; keep that link (and ?project=&plot=) working.
          mkdir -p admin/out/site/layouts
          cat > admin/out/site/layouts/index.html <<EOF
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <title>Live layouts - Greater Infra Projects</title>
          <meta http-equiv="refresh" content="0; url=${NEXT_PUBLIC_LAYOUTS_URL}">
          <script>location.replace('${NEXT_PUBLIC_LAYOUTS_URL}' + location.search + location.hash)</script>
          </head><body><a href="${NEXT_PUBLIC_LAYOUTS_URL}">Live layouts have moved: open them here.</a></body></html>
          EOF

      # Pages sends HSTS and Cache-Control itself but no custom headers, so the CSP goes into every page.
      - name: Content-Security-Policy
        run: node .github/scripts/pages-csp.mjs admin/out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/out

  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
