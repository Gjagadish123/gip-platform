# The admin, the website and the live layouts all run on their own server now (deploy/kvm):
#   admin   → https://admin.greaterinfraprojects.in
#   website → https://www.greaterinfraprojects.in
#   layouts → https://www.greaterinfraprojects.in/layouts/
# GitHub Pages only keeps the old preview addresses working: every path answers with a page that forwards to the same
# place on the new hosts (/layouts/... and /site/layouts/... to the layouts, /site/... to the website, the rest, the old
# admin, to the admin), keeping ?project=…&plot=… and #hash.
name: GitHub Pages forwarding

on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-admin-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Forwarding pages
        run: |
          mkdir -p out
          touch out/.nojekyll
          cat > out/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <title>Greater Infra Projects</title>
          <script>var p = location.pathname.replace(/^\/gip-platform/, ""), q = location.search + location.hash;
          location.replace(/^(\/site)?\/layouts(\/|$)/.test(p) ? "https://www.greaterinfraprojects.in/layouts/" + q
            : /^\/site(\/|$)/.test(p) ? "https://www.greaterinfraprojects.in" + (p.slice(5) || "/") + q
            : "https://admin.greaterinfraprojects.in" + p + q);</script>
          </head><body><p>Greater Infra Projects has moved: the website is at <a href="https://www.greaterinfraprojects.in">www.greaterinfraprojects.in</a>
          and the admin at <a href="https://admin.greaterinfraprojects.in">admin.greaterinfraprojects.in</a>.</p></body></html>
          EOF
          cp out/index.html out/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
