# Static client preview of the admin UI at https://gjagadish123.github.io/gip-platform/
name: Deploy admin preview to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/deploy-admin-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          GITHUB_PAGES: "true"
      - run: node scripts/flatten-segments.mjs out && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
