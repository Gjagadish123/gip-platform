# One GitHub Pages site, two static previews:
#   admin   → https://gjagadish123.github.io/gip-platform/        (the link the client already has)
#   website → https://gjagadish123.github.io/gip-platform/site/
# Both are noindex previews; the real website launches on a Node host with the image optimizer and Cache Components.
# Both run on the live Supabase project: the admin signs in and writes there, the website reads it at build time and
# follows it live in the browser. The URL and publishable key are public by design (every visitor's browser gets them;
# RLS decides what they can read). The Google Maps browser key is a repository secret; without it the website shows
# the layouts as plans, without the map or nearby places. Never put the Supabase secret key here.
name: Deploy previews to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["admin/**", "website/**", ".github/workflows/deploy-admin-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://jjskgxbshmjsfrowlzsj.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cJWKoNVL9CRIxkrwRHLxsw_aVvCxAjU

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            website/package-lock.json

      - name: Build admin (/gip-platform/)
        working-directory: admin
        run: |
          npm ci
          npx next build
          node scripts/flatten-segments.mjs out
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_WEBSITE_URL: https://gjagadish123.github.io/gip-platform/site

      - name: Build website (/gip-platform/site/)
        working-directory: website
        run: |
          npm ci
          npx next build
          node scripts/flatten-segments.mjs out
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /gip-platform/site
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Assemble one Pages tree
        run: |
          mkdir -p admin/out/site
          cp -R website/out/. admin/out/site/
          touch admin/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
